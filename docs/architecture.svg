<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 992" width="1280" height="992" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Clinic Plan: system architecture</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5d6b7a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62f2f"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b3fb5"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b26a00"/>
    </marker>
    <style>
      .t  { font-size: 14px; font-weight: 700; fill: #17202a; }
      .s  { font-size: 12px; fill: #5d6b7a; }
      .k  { font-size: 12px; fill: #0b6bcb; font-family: ui-monospace, Menlo, Consolas, monospace; }
      .kp { font-size: 12px; fill: #6b3fb5; font-family: ui-monospace, Menlo, Consolas, monospace; }
      .m  { font-size: 11.5px; fill: #17202a; font-family: ui-monospace, Menlo, Consolas, monospace; }
      .h  { font-size: 12px; font-weight: 700; fill: #5d6b7a; letter-spacing: .06em; }
      .lbl { font-size: 11.5px; fill: #5d6b7a; }
      .lbl-red { font-size: 11.5px; fill: #c62f2f; font-weight: 600; }
      .lbl-purple { font-size: 11.5px; fill: #6b3fb5; font-weight: 600; }
      .lbl-orange { font-size: 11.5px; fill: #b26a00; font-weight: 600; }
      .node { fill: #ffffff; stroke: #c5ccd5; stroke-width: 1.2; }
      .edge { stroke: #5d6b7a; stroke-width: 1.4; fill: none; }
    </style>
  </defs>

  <rect width="1280" height="992" fill="#ffffff"/>

  <!-- ===================== top row: user, console, Gemini ===================== -->
  <rect x="40" y="36" width="220" height="74" rx="10" class="node"/>
  <text x="60" y="66" class="t">Outreach lead / judge</text>
  <text x="60" y="88" class="s">browser</text>

  <rect x="340" y="26" width="330" height="94" rx="10" fill="#eaf3fc" stroke="#0b6bcb" stroke-width="1.6"/>
  <text x="360" y="52" class="t">Cloud Run · clinic-ui</text>
  <text x="560" y="52" class="lbl" font-weight="700" fill="#0b6bcb">PUBLIC</text>
  <text x="360" y="74" class="s">FastAPI + static console (no build step)</text>
  <text x="360" y="94" class="m">POST /api/run → SSE · GET /api/replay</text>
  <text x="360" y="110" class="s">max 1 instance: one live run at a time</text>

  <path d="M260,73 L338,73" class="edge" marker-end="url(#arr)"/>
  <text x="272" y="64" class="lbl">HTTPS</text>

  <rect x="980" y="30" width="260" height="80" rx="10" class="node"/>
  <text x="1000" y="60" class="t">Vertex AI · Gemini</text>
  <text x="1000" y="82" class="m">gemini-3.6-flash</text>
  <text x="1000" y="99" class="s">location: global</text>

  <!-- console -> Agent Runtime -->
  <path d="M505,120 L505,170" class="edge" marker-end="url(#arr)"/>
  <text x="515" y="143" class="lbl">vertexai SDK · async_stream_query · events streamed back</text>
  <text x="515" y="158" class="lbl">(service account clinic-ui, roles/aiplatform.user)</text>

  <!-- ===================== Agent Runtime ===================== -->
  <rect x="30" y="172" width="870" height="600" rx="14" fill="#f6f7f9" stroke="#8a97a6" stroke-width="1.4"/>
  <text x="50" y="198" class="t">Agent Runtime · clinic-planner</text>
  <text x="290" y="198" class="lbl" font-weight="700">PRIVATE</text>
  <text x="360" y="198" class="s">ADK 2.7 · SequentialAgent clinic_plan · sessions managed by Agent Runtime</text>

  <!-- Agent Runtime -> Gemini -->
  <path d="M900,215 C960,215 1060,170 1080,112" class="edge" marker-end="url(#arr)"/>
  <text x="1092" y="166" class="lbl">model calls</text>

  <!-- stage 1 -->
  <rect x="50" y="212" width="830" height="110" rx="10" fill="#ffffff" stroke="#dde2e8"/>
  <text x="66" y="232" class="h">1 · EVIDENCE · ParallelAgent (three lookups, one hop)</text>
  <rect x="66" y="244" width="250" height="62" rx="8" class="node"/>
  <text x="80" y="268" class="t">need_scout</text>
  <text x="80" y="290" class="k">→ evidence_need</text>
  <rect x="340" y="244" width="250" height="62" rx="8" class="node"/>
  <text x="354" y="268" class="t">coverage_scout</text>
  <text x="354" y="290" class="k">→ evidence_coverage</text>
  <rect x="614" y="244" width="250" height="62" rx="8" class="node"/>
  <text x="628" y="268" class="t">respiratory_scout</text>
  <text x="628" y="290" class="k">→ evidence_respiratory</text>

  <path d="M465,322 L465,340" class="edge" marker-end="url(#arr)"/>

  <!-- stage 2 -->
  <rect x="50" y="342" width="830" height="238" rx="10" fill="#fff8f8" stroke="#c62f2f" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="66" y="362" class="h">2 · PLAN AND REVIEW · LoopAgent (max 3 rounds)</text>
  <text x="458" y="362" class="lbl-red">where the system rejects its own first answer</text>

  <!-- rejection loop back: reviewer -> planner -->
  <path d="M470,400 C470,376 181,376 181,396" stroke="#c62f2f" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>
  <text x="488" y="390" class="lbl-red">REJECTED → planner revises (next round)</text>

  <rect x="66" y="400" width="230" height="60" rx="8" class="node"/>
  <text x="80" y="424" class="t">planner</text>
  <text x="80" y="446" class="k">→ plan</text>
  <rect x="356" y="400" width="230" height="60" rx="8" class="node"/>
  <text x="370" y="424" class="t">reviewer</text>
  <text x="370" y="446" class="k">→ review</text>
  <rect x="646" y="400" width="218" height="60" rx="8" class="node"/>
  <text x="660" y="424" class="t">approval_gate</text>
  <text x="660" y="446" class="s">ends loop if plan_approved</text>

  <path d="M296,422 L354,422" class="edge" marker-end="url(#arr)"/>
  <path d="M586,422 L644,422" class="edge" marker-end="url(#arr)"/>

  <!-- our tools -->
  <rect x="66" y="490" width="230" height="66" rx="8" fill="#fff6e8" stroke="#b26a00" stroke-width="1.3"/>
  <text x="80" y="512" class="t">plan_saturdays()</text>
  <text x="80" y="531" class="lbl-orange">our tool · wraps saturdays.py</text>
  <text x="80" y="548" class="lbl">reads v_van_need directly</text>
  <rect x="356" y="490" width="230" height="66" rx="8" fill="#fff6e8" stroke="#b26a00" stroke-width="1.3"/>
  <text x="370" y="512" class="t">check_plan_rules()</text>
  <text x="370" y="531" class="lbl-orange">our tool · 2 review rules</text>
  <text x="370" y="548" class="lbl">reads the plan from state</text>

  <path d="M181,460 L181,488" class="edge" marker-end="url(#arr)"/>
  <path d="M471,460 L471,488" class="edge" marker-end="url(#arr)"/>
  <!-- tool <-> tool through state -->
  <path d="M296,508 L354,508" stroke="#b26a00" stroke-width="1.4" fill="none" marker-end="url(#arr-orange)"/>
  <path d="M354,536 L298,536" stroke="#b26a00" stroke-width="1.4" fill="none" marker-end="url(#arr-orange)"/>
  <text x="326" y="484" class="m" font-size="10" text-anchor="middle">plan_data</text>
  <text x="290" y="572" class="m" font-size="10.5">excluded_geo_ids ←</text>

  <!-- state keys written by tools -->
  <text x="606" y="506" class="s">tools also write:</text>
  <text x="606" y="524" class="k">plan_round · plan_history</text>
  <text x="606" y="541" class="k">plan_approved · rejection_log</text>
  <text x="606" y="558" class="k">picked_tract_ids → auditor</text>

  <path d="M465,580 L465,598" class="edge" marker-end="url(#arr)"/>

  <!-- stage 3 -->
  <rect x="50" y="600" width="830" height="130" rx="10" fill="#ffffff" stroke="#dde2e8"/>
  <text x="66" y="620" class="h">3 · AUDIT · EXPLAIN · REPORT (include_contents="none": state keys only, no planner chat)</text>
  <rect x="66" y="634" width="250" height="80" rx="8" fill="#f4effc" stroke="#6b3fb5" stroke-width="1.6"/>
  <text x="80" y="658" class="t">auditor</text>
  <text x="80" y="678" class="kp">→ audit</text>
  <text x="80" y="698" class="lbl-purple">sees demographics · cannot re-plan</text>
  <rect x="340" y="634" width="250" height="80" rx="8" class="node"/>
  <text x="354" y="658" class="t">explainer</text>
  <text x="354" y="678" class="k">→ flyer</text>
  <text x="354" y="698" class="s">English + Español · no numbers</text>
  <rect x="614" y="634" width="250" height="80" rx="8" class="node"/>
  <text x="628" y="658" class="t">reporter</text>
  <text x="628" y="678" class="k">→ clinic_plan</text>
  <text x="628" y="698" class="s">4 parts + "where agents disagreed"</text>

  <path d="M316,674 L338,674" class="edge" marker-end="url(#arr)"/>
  <path d="M590,674 L612,674" class="edge" marker-end="url(#arr)"/>

  <!-- ===================== Toolbox ===================== -->
  <rect x="940" y="232" width="300" height="230" rx="12" fill="#ffffff" stroke="#8a97a6" stroke-width="1.4"/>
  <text x="958" y="258" class="t">Cloud Run · toolbox</text>
  <text x="1120" y="258" class="lbl" font-weight="700">PRIVATE</text>
  <text x="958" y="278" class="s">MCP Toolbox for Databases v1.17</text>
  <text x="958" y="294" class="s">6 BigQuery tools · MCP/HTTPS + ID token</text>

  <rect x="956" y="308" width="268" height="72" rx="8" fill="#eaf3fc" stroke="#0b6bcb"/>
  <text x="970" y="328" class="t" font-size="13">planner_tools</text>
  <text x="970" y="347" class="m" font-size="10.5">top_need_tracts · tract_detail</text>
  <text x="970" y="364" class="m" font-size="10.5">county_coverage · respiratory_trend</text>

  <rect x="956" y="392" width="268" height="56" rx="8" fill="#f4effc" stroke="#6b3fb5"/>
  <text x="970" y="412" class="t" font-size="13" fill="#6b3fb5">auditor_tools</text>
  <text x="970" y="432" class="m" font-size="10.5">audit_plan · audit_top_decile</text>

  <!-- scouts + planner -> planner_tools -->
  <path d="M880,276 C910,276 920,330 954,334" class="edge" marker-end="url(#arr)"/>
  <path d="M900,430 C928,430 930,362 954,358" class="edge" marker-end="url(#arr)"/>
  <text x="884" y="266" class="lbl">scouts</text>
  
  <!-- auditor -> auditor_tools, along the bottom channel -->
  <path d="M191,714 L191,752 L922,752 L922,428 L954,428" stroke="#6b3fb5" stroke-width="1.6" fill="none" marker-end="url(#arr-purple)"/>
  <text x="210" y="746" class="lbl-purple">auditor only: the planner, reviewer and scouts never get auditor_tools</text>

  <!-- ===================== BigQuery ===================== -->
  <rect x="940" y="500" width="300" height="272" rx="12" fill="#effaf3" stroke="#1d8a4e" stroke-width="1.4"/>
  <text x="958" y="526" class="t">BigQuery · a4i_health</text>
  <text x="958" y="548" class="s">8 tables (notebook c5_01 / load.sh)</text>
  <rect x="956" y="560" width="268" height="44" rx="6" fill="#ffffff" stroke="#1d8a4e"/>
  <text x="968" y="578" class="m">v_van_need · v_coverage</text>
  <text x="968" y="595" class="s">planner-safe: no demographics</text>
  <rect x="956" y="612" width="268" height="44" rx="6" fill="#ffffff" stroke="#6b3fb5"/>
  <text x="968" y="630" class="m" fill="#6b3fb5">v_equity_audit_*</text>
  <text x="968" y="647" class="s">auditor only: joins Census ACS race, poverty</text>
  <text x="958" y="676" class="s">+ bigquery-public-data ACS 2020 tracts</text>
  <text x="958" y="694" class="s">views built by data/run_sql.sh</text>
  <text x="958" y="718" class="s">read via the Toolbox, and directly</text>
  <text x="958" y="735" class="s">by plan_saturdays() (v_van_need only)</text>

  <path d="M1090,462 L1090,498" class="edge" marker-end="url(#arr)"/>

  <!-- ===================== bottom: rules + legend ===================== -->
  <rect x="30" y="796" width="1210" height="170" rx="12" fill="#f6f7f9" stroke="#dde2e8"/>
  <text x="50" y="822" class="h">WHY IT IS SHAPED THIS WAY</text>
  <text x="50" y="846" class="s"><tspan font-weight="700" fill="#6b3fb5">Race is an audit, never an input.</tspan> The planner and reviewer never load auditor_tools (enforced by Toolbox toolsets, not just prompts).</text>
  <text x="50" y="865" class="s">The auditor runs after the loop and cannot send the plan back, so demographics can never reach the plan through the back door.</text>
  <text x="50" y="889" class="s"><tspan font-weight="700" fill="#c62f2f">Rejections are guaranteed to bite.</tspan> check_plan_rules writes excluded_geo_ids to session.state; the next plan_saturdays call reads it. The model cannot argue past it.</text>
  <text x="50" y="913" class="s"><tspan font-weight="700" fill="#0b6bcb">Conflicting instructions, separate agents.</tspan> Planner and reviewer hedge and label every number's scale; the explainer is forbidden numbers, hedges and jargon.</text>
  <text x="50" y="937" class="s"><tspan font-weight="700" fill="#1d8a4e">Only the console is public.</tspan> Agent Runtime and the Toolbox are private; each hop authenticates with its own service identity.</text>

  <!-- legend -->
  <g transform="translate(452,810)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#fff6e8" stroke="#b26a00"/><text x="20" y="12" class="lbl">tool we wrote</text>
    <rect x="118" y="0" width="14" height="14" rx="3" fill="#f4effc" stroke="#6b3fb5"/><text x="138" y="12" class="lbl">auditor scope</text>
    <text x="246" y="12" class="k">→ key</text><text x="290" y="12" class="lbl">session.state output_key</text>
    <path d="M450,7 L486,7" stroke="#c62f2f" stroke-width="1.5" marker-end="url(#arr-red)"/><text x="494" y="12" class="lbl">rejection loop</text>
    <path d="M600,7 L636,7" stroke="#6b3fb5" stroke-width="1.6" marker-end="url(#arr-purple)"/><text x="644" y="12" class="lbl">auditor data path</text>
  </g>
</svg>
